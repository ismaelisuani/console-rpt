<% password_digest = BCrypt::Password.create("password") %>

admin:
  name: Admin
  username: admin
  email_address: admin@example.com
  password_digest: <%= password_digest %>
  role: administrator

dispatcher:
  name: Dispatcher
  username: dispatcher
  email_address: dispatcher@example.com
  password_digest: <%= password_digest %>
  role: dispatcher

listener:
  name: Listener
  username: listener
  password_digest: <%= password_digest %>
  role: listener
