# The AMI listener (bin/ami) broadcasts from its own process: development
# needs a cross-process adapter (PostgreSQL LISTEN/NOTIFY on the main database)
development:
  adapter: postgresql

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
